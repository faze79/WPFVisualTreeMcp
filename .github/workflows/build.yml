name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  plugin:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install tested Codex CLI
      run: npm install --global @openai/codex@0.162.1 --no-audit --no-fund
    - name: Verify plugin installation and skill upgrade
      shell: pwsh
      run: |
        $cli = Join-Path (npm root --global) '@openai/codex/bin/codex.js'
        python ./scripts/test-plugin.py --codex-cli $cli

  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3

    - name: Build native bootstrapper (x86 and x64)
      shell: pwsh
      run: ./scripts/Build-NativeBootstrapper.ps1

    - name: Restore dependencies
      run: dotnet restore WpfVisualTreeMcp.sln

    - name: Build
      run: dotnet build WpfVisualTreeMcp.sln --no-restore --configuration Release

    - name: Test
      run: dotnet test WpfVisualTreeMcp.sln --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: '**/TestResults/*.trx'

    - name: Publish MCP Server
      run: dotnet publish src/WpfVisualTreeMcp.Server/WpfVisualTreeMcp.Server.csproj --no-build --configuration Release --output ./publish

    - name: Install x86 .NET runtime for injection helper
      shell: pwsh
      run: |
        Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile "$env:RUNNER_TEMP/dotnet-install.ps1"
        & "$env:RUNNER_TEMP/dotnet-install.ps1" -Channel 8.0 -Runtime dotnet -Architecture x86 -InstallDir "$env:RUNNER_TEMP/dotnet-x86" -NoPath
        "DOTNET_ROOT_X86=$env:RUNNER_TEMP/dotnet-x86" >> $env:GITHUB_ENV

    - name: Test published injection (x64 and x86)
      shell: pwsh
      run: ./scripts/Test-Injection.ps1 -ServerDirectory ./publish

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wpf-visual-tree-mcp
        path: ./publish

  code-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # Server transitively references the WPF (net8.0-windows) Inspector, so a
    # restore/format on Linux needs Windows targeting enabled.
    - name: Restore dependencies
      run: dotnet restore src/WpfVisualTreeMcp.Server/WpfVisualTreeMcp.Server.csproj -p:EnableWindowsTargeting=true

    - name: Check formatting
      run: dotnet format src/WpfVisualTreeMcp.Server/WpfVisualTreeMcp.Server.csproj --verify-no-changes --verbosity diagnostic
      continue-on-error: true

  # Build verification for .NET Framework projects (Windows only)
  build-netfx:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3

    - name: Restore NuGet packages
      run: dotnet restore WpfVisualTreeMcp.sln

    - name: Build .NET Framework projects
      run: |
        dotnet build src/WpfVisualTreeMcp.Inspector/WpfVisualTreeMcp.Inspector.csproj --configuration Release
        dotnet build src/WpfVisualTreeMcp.Injector/WpfVisualTreeMcp.Injector.csproj --configuration Release
        dotnet build samples/SampleWpfApp/SampleWpfApp.csproj --configuration Release
