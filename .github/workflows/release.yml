name: Release

on:
  push:
    tags:
      - 'v*'

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write    # create the GitHub release
      id-token: write    # NuGet trusted publishing (OIDC) - no API key secret needed
    env:
      # secrets can't be referenced directly in step-level if: - surface presence as a plain string
      HAS_NUGET_USER: ${{ secrets.NUGET_USER != '' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Verify release versions
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}".TrimStart('v')
        foreach ($project in @('Server', 'Automation')) {
          [xml]$xml = Get-Content "src/WpfVisualTreeMcp.$project/WpfVisualTreeMcp.$project.csproj"
          if ($xml.Project.PropertyGroup.Version -ne $version) { throw "$project version does not match $version" }
        }
        $manifest = Get-Content src/WpfVisualTreeMcp.Server/.mcp/server.json -Raw | ConvertFrom-Json
        $plugin = Get-Content plugins/wpfvisualtreemcp/.codex-plugin/plugin.json -Raw | ConvertFrom-Json
        if ($manifest.version -ne $version -or $manifest.packages[0].version -ne $version -or $plugin.version -ne $version) {
          throw 'MCP or plugin manifest version does not match the release tag'
        }

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3

    - name: Build native bootstrapper (x86 and x64)
      shell: pwsh
      run: ./scripts/Build-NativeBootstrapper.ps1

    - name: Restore dependencies
      run: dotnet restore WpfVisualTreeMcp.sln

    - name: Build Release
      run: dotnet build WpfVisualTreeMcp.sln --no-restore --configuration Release

    - name: Test
      run: dotnet test WpfVisualTreeMcp.sln --no-build --configuration Release --verbosity normal

    - name: Publish MCP Server
      run: dotnet publish src/WpfVisualTreeMcp.Server/WpfVisualTreeMcp.Server.csproj --no-build --configuration Release --output ./publish/server

    - name: Pack C# automation SDK
      run: dotnet pack src/WpfVisualTreeMcp.Automation/WpfVisualTreeMcp.Automation.csproj --no-build --configuration Release --output ./artifacts/packages

    - name: Install x86 .NET 8, 9 and 10 runtimes for compatibility tests
      shell: pwsh
      run: |
        Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile "$env:RUNNER_TEMP/dotnet-install.ps1"
        foreach ($channel in @('8.0', '9.0', '10.0')) {
          foreach ($runtime in @('dotnet', 'windowsdesktop')) {
            & "$env:RUNNER_TEMP/dotnet-install.ps1" -Channel $channel -Runtime $runtime -Architecture x86 -InstallDir "$env:RUNNER_TEMP/dotnet-x86" -NoPath
            if ($LASTEXITCODE -ne 0) { throw "Failed to install x86 $runtime $channel" }
          }
        }
        "DOTNET_ROOT_X86=$env:RUNNER_TEMP/dotnet-x86" >> $env:GITHUB_ENV

    - name: Test standalone NuGet consumer and exported xUnit tests
      run: python ./scripts/test_automation_package.py --packages ./artifacts/packages

    - name: Test published injection (x64 and x86)
      shell: pwsh
      run: ./scripts/Test-Injection.ps1 -ServerDirectory ./publish/server

    - name: Test framework, architecture and screenshot matrix
      shell: pwsh
      run: ./tests/run-integration-tests.ps1 -ServerDirectory ./publish/server

    - name: Publish Inspector DLL
      run: dotnet publish src/WpfVisualTreeMcp.Inspector/WpfVisualTreeMcp.Inspector.csproj --configuration Release --framework net8.0-windows --output ./publish/inspector

    - name: Create release archive
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath ./WpfVisualTreeMcp-${{ github.ref_name }}-win-x64.zip

    - name: Create Codex plugin archive
      shell: pwsh
      # git archive preserves the dot-directories required by the marketplace and plugin.
      run: |
        git archive --format=zip --output=./WpfVisualTreeMcp-${{ github.ref_name }}-codex-plugin.zip HEAD .agents/plugins plugins/wpfvisualtreemcp LICENSE
        if ($LASTEXITCODE -ne 0) { throw 'Codex plugin archive failed' }

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install tested Codex CLI
      run: npm install --global @openai/codex@0.162.1 --no-audit --no-fund
    - name: Verify packaged plugin and skill upgrade
      shell: pwsh
      run: |
        $cli = Join-Path (npm root --global) '@openai/codex/bin/codex.js'
        python ./scripts/test-plugin.py --codex-cli $cli --archive ./WpfVisualTreeMcp-${{ github.ref_name }}-codex-plugin.zip

    - name: Pack MCP NuGet package
      run: dotnet pack src/WpfVisualTreeMcp.Server/WpfVisualTreeMcp.Server.csproj --configuration Release --output ./artifacts/packages

    - name: Verify NuGet injection payload
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}".TrimStart('v')
        $packages = @(Get-ChildItem ./artifacts/packages/*.nupkg)
        if ($packages.Count -ne 2) { throw 'Expected the MCP and Automation NuGet packages' }
        ./scripts/Test-NuGetPayload.ps1 -Package "./artifacts/packages/WpfVisualTreeMcp.$version.nupkg"

    - name: Build and verify full and compact MCPB bundles
      shell: pwsh
      run: |
        ./scripts/Build-McpBundle.ps1 -OutputDirectory ./artifacts/mcpb-full
        ./scripts/Build-McpBundle.ps1 -OutputDirectory ./artifacts/mcpb-compact -Compact

    - name: Test compact bundle workflow
      shell: pwsh
      run: |
        $matrix = Get-ChildItem ./TestResults -Directory -Filter 'matrix-*' | Select-Object -First 1
        if (-not $matrix) { throw 'Integration matrix samples are missing' }
        $sample = Join-Path $matrix.FullName 'samples/net8.0-windows/x64/AutoInjection/SampleWpfApp.exe'
        python ./scripts/test_workflow.py --server ./artifacts/mcpb-compact/bundle/server/WpfVisualTreeMcp.Server.exe --sample $sample
        if ($LASTEXITCODE -ne 0) { throw 'Compact MCPB workflow test failed' }

    # Trusted publishing (OIDC): requires a policy at nuget.org/account/trustedpublishing
    # for repo faze79/WPFVisualTreeMcp, workflow release.yml, both packages
    # WpfVisualTreeMcp and WpfVisualTreeMcp.Automation (including new-package scope),
    # plus a repo secret NUGET_USER = the nuget.org profile name. Skipped with a notice
    # until NUGET_USER is set, so tagging still produces the GitHub release meanwhile.
    - name: NuGet login (OIDC)
      id: nuget_login
      if: env.HAS_NUGET_USER == 'true'
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push to NuGet.org
      if: env.HAS_NUGET_USER == 'true'
      shell: pwsh
      # pwsh does not expand the *.nupkg glob into the dotnet arg - resolve it explicitly
      env:
        NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
      run: |
        foreach ($pkg in Get-ChildItem ./artifacts/packages/*.nupkg) {
          dotnet nuget push $pkg.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          if ($LASTEXITCODE -ne 0) { throw "NuGet publish failed: $($pkg.Name)" }
        }

    - name: NuGet publish skipped
      if: env.HAS_NUGET_USER != 'true'
      shell: pwsh
      run: Write-Host "NUGET_USER secret not set - skipping NuGet publish (see docs/PROMOTION.md)."

    - name: Extract version notes
      id: notes
      shell: pwsh
      run: |
        $changelog = Get-Content CHANGELOG.md -Raw
        $version = "${{ github.ref_name }}".TrimStart('v')
        $pattern = "(?s)## \[$version\].*?(?=## \[|$)"
        $match = [regex]::Match($changelog, $pattern)
        if ($match.Success) {
          $notes = $match.Value.Trim()
          $notes | Out-File -FilePath release-notes.md -Encoding utf8
        } else {
          "Release ${{ github.ref_name }}" | Out-File -FilePath release-notes.md -Encoding utf8
        }

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        body_path: release-notes.md
        files: |
          ./WpfVisualTreeMcp-${{ github.ref_name }}-win-x64.zip
          ./WpfVisualTreeMcp-${{ github.ref_name }}-codex-plugin.zip
          ./artifacts/packages/*.nupkg
          ./artifacts/mcpb-full/*.mcpb
          ./artifacts/mcpb-compact/*.mcpb
        draft: false
        prerelease: ${{ contains(github.ref_name, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
