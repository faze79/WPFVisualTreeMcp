name: Release

on:
  push:
    tags:
      - 'v*'

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write    # create the GitHub release
      id-token: write    # NuGet trusted publishing (OIDC) - no API key secret needed
    env:
      # secrets can't be referenced directly in step-level if: - surface presence as a plain string
      HAS_NUGET_USER: ${{ secrets.NUGET_USER != '' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3

    - name: Restore dependencies
      run: dotnet restore WpfVisualTreeMcp.sln

    - name: Build Release
      run: dotnet build WpfVisualTreeMcp.sln --no-restore --configuration Release

    - name: Test
      run: dotnet test WpfVisualTreeMcp.sln --no-build --configuration Release --verbosity normal

    - name: Publish MCP Server
      run: dotnet publish src/WpfVisualTreeMcp.Server/WpfVisualTreeMcp.Server.csproj --no-build --configuration Release --output ./publish/server

    - name: Publish Inspector DLL
      run: dotnet publish src/WpfVisualTreeMcp.Inspector/WpfVisualTreeMcp.Inspector.csproj --configuration Release --framework net8.0-windows --output ./publish/inspector

    - name: Create release archive
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath ./WpfVisualTreeMcp-${{ github.ref_name }}-win-x64.zip

    - name: Pack NuGet package
      run: dotnet pack src/WpfVisualTreeMcp.Server/WpfVisualTreeMcp.Server.csproj --configuration Release --output ./artifacts

    # Trusted publishing (OIDC): requires a policy at nuget.org/account/trustedpublishing
    # for repo faze79/WPFVisualTreeMcp, workflow release.yml, package WpfVisualTreeMcp,
    # plus a repo secret NUGET_USER = the nuget.org profile name. Skipped with a notice
    # until NUGET_USER is set, so tagging still produces the GitHub release meanwhile.
    - name: NuGet login (OIDC)
      id: nuget_login
      if: env.HAS_NUGET_USER == 'true'
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push to NuGet.org
      if: env.HAS_NUGET_USER == 'true'
      shell: pwsh
      # pwsh does not expand the *.nupkg glob into the dotnet arg - resolve it explicitly
      run: |
        $pkg = Get-ChildItem ./artifacts/*.nupkg | Select-Object -First 1
        dotnet nuget push $pkg.FullName --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: NuGet publish skipped
      if: env.HAS_NUGET_USER != 'true'
      shell: pwsh
      run: Write-Host "NUGET_USER secret not set - skipping NuGet publish (see docs/PROMOTION.md)."

    - name: Extract version notes
      id: notes
      shell: pwsh
      run: |
        $changelog = Get-Content CHANGELOG.md -Raw
        $version = "${{ github.ref_name }}".TrimStart('v')
        $pattern = "(?s)## \[$version\].*?(?=## \[|$)"
        $match = [regex]::Match($changelog, $pattern)
        if ($match.Success) {
          $notes = $match.Value.Trim()
          $notes | Out-File -FilePath release-notes.md -Encoding utf8
        } else {
          "Release ${{ github.ref_name }}" | Out-File -FilePath release-notes.md -Encoding utf8
        }

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        body_path: release-notes.md
        files: |
          ./WpfVisualTreeMcp-${{ github.ref_name }}-win-x64.zip
          ./artifacts/*.nupkg
        draft: false
        prerelease: ${{ contains(github.ref_name, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
