name: Publish to MCP Registry

# Publishes src/WpfVisualTreeMcp.Server/.mcp/server.json to the official MCP
# registry (registry.modelcontextprotocol.io). Run manually AFTER the NuGet
# package version referenced in server.json is live on nuget.org — the registry
# validates that the package exists and embeds a matching .mcp/server.json.
#
# Auth is GitHub OIDC: publishing to the io.github.faze79/* namespace is
# authorized by this workflow running in a repo owned by faze79. No secrets needed.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Stage server.json
        run: cp src/WpfVisualTreeMcp.Server/.mcp/server.json server.json

      - name: Wait for NuGet validation and indexing
        run: |
          python3 - <<'PY'
          import json, time, urllib.error, urllib.request
          manifest = json.load(open('server.json'))
          for package in manifest['packages']:
              if package['registryType'] != 'nuget':
                  continue
              name, version = package['identifier'], package['version']
              url = f'https://api.nuget.org/v3-flatcontainer/{name.lower()}/index.json'
              for attempt in range(45):
                  try:
                      request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(request, timeout=15) as response:
                          versions = json.load(response)['versions']
                      if version in versions:
                          print(f'{name} {version} is available on nuget.org', flush=True)
                          break
                  except (urllib.error.URLError, TimeoutError) as error:
                      print(f'NuGet is not ready: {error}', flush=True)
                  if attempt == 44:
                      raise SystemExit(f'{name} {version} is still unavailable after waiting for NuGet validation')
                  print(f'Waiting for {name} {version} ({attempt + 1}/45)', flush=True)
                  time.sleep(20)
          PY

      - name: Login to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
